<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>리빌더스 앱에서 열기</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
    main { width: min(360px, 88vw); padding: 28px 22px; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 18px; font-size: 13px; line-height: 1.5; color: #52525b; }
    a { display: block; padding: 14px; border-radius: 12px; background: #18181b; color: #fff; font-weight: 800; text-decoration: none; }
    small { display: block; margin-top: 14px; font-size: 11px; color: #a1a1aa; }
  </style>
</head>
<body>
  <main>
    <h1>리빌더스 앱에서 기록하기</h1>
    <p id="msg">아래 버튼을 누르면 앱이 열리고, 기록할 내용을 확인한 뒤 저장할 수 있어요.</p>
    <a id="open" href="rebuilders://log">리빌더스 앱에서 열기</a>
    <small>이 페이지는 링크 내용을 서버에 저장하거나 보내지 않고, 앱으로 그대로 넘기기만 해요.</small>
  </main>
  <script>
    // 쿼리의 d 값만 앱 링크로 그대로 넘깁니다(저장·전송 없음).
    (function () {
      var d = new URLSearchParams(location.search).get('d') || '';
      var open = document.getElementById('open');
      if (!/^[A-Za-z0-9_-]{1,8000}={0,2}$/.test(d)) {
        document.getElementById('msg').textContent = '기록 링크가 올바르지 않아요. 텔레그램에서 링크를 다시 받아주세요.';
        open.hidden = true;
        return;
      }
      var target = 'rebuilders://log?d=' + d;
      open.href = target;
      setTimeout(function () { location.href = target; }, 300);
    })();
  </script>
</body>
</html>
